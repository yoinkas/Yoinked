<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jackpot Draft Card | Yoinked</title>
  <link rel="stylesheet" href="/yoinked/assets/styles.css" />
  <style>
    .draft-banner{padding:12px 18px;background:#172131;border:1px solid #45d6a6;color:#b5f7e2;border-radius:10px;margin-bottom:24px}
    .draft-card{overflow:hidden}.draft-card img{width:100%;height:240px;object-fit:cover;display:block}.draft-card-body{padding:22px}
    .draft-tags{display:flex;gap:8px;margin-bottom:12px}.draft-tag{font-size:12px;font-weight:700;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:#202d40;color:#7ce8c5}
  </style>
</head>
<body>
  <header class="site-header"><div class="container"><a class="logo" href="/yoinked/index.html">Yoinked by Yoinkas</a></div></header>
  <main><section class="section"><div class="container">
    <div class="draft-banner">Local preview only — this Jackpot card has not been published or pushed.</div>
    <div class="section-header"><h1>Draft writeup</h1><p>Preview the card and open the generated article before publishing.</p></div>
    <div class="card-grid stack-top" id="draft-card"><article class="card"><div class="draft-card-body">Loading Jackpot…</div></article></div>
  </div></section></main>
  <script>
    const escapeHtml = value => String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    fetch('/api/writeups').then(response => response.json()).then(notes => {
      const note = notes.find(item => String(item.title).toLowerCase() === 'jackpot');
      if (!note) throw new Error('Jackpot draft not found');
      const meta = (note.blocks.find(block => block.type === 'box') || {}).box || {};
      const cover = /^data:image\//.test(meta.cover || '') ? `<img src="${meta.cover}" alt="Jackpot cover" />` : '';
      document.getElementById('draft-card').innerHTML = `<article class="card draft-card">${cover}<div class="draft-card-body">
        <div class="draft-tags"><span class="draft-tag">${escapeHtml(meta.platform)}</span><span class="draft-tag">${escapeHtml(meta.difficulty)}</span><span class="draft-tag">${escapeHtml(meta.os)}</span></div>
        <h2>${escapeHtml(note.title)}</h2><p>A custom XFS banking-protocol challenge covering service enumeration, binary analysis, framed requests, and terminal cashout.</p>
        <a class="btn" href="/drafts/writeups/previews/jackpot.html">Open draft writeup</a></div></article>`;
    }).catch(error => { document.getElementById('draft-card').textContent = error.message; });
  </script>
</body>
</html>

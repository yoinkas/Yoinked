<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>tip stacking</title>
<style>body{font:13px monospace;background:#000;color:#eee;padding:10px}iframe{width:1100px;height:600px;border:0}</style></head>
<body><pre id="out">…</pre><iframe id="f" src="/index.html"></iframe>
<script>
document.getElementById('f').addEventListener('load', function () {
  var d = this.contentDocument, w = this.contentWindow;
  setTimeout(function () {
    var W = w.WriteUp, n = W.getCurrent();
    n.blocks = [{ id: 'z-t', type: 'tip', html: 'A tip', body: 'The note body.' }];
    W.persist(); W.render();
    setTimeout(function () {
      w.WriteUpTips.open('z-t');
      setTimeout(function () {
        var m = d.getElementById('tip-modal');
        var cs = w.getComputedStyle(m);
        var r = m.getBoundingClientRect();
        var panel = m.querySelector('.tip-modal');
        var pr = panel.getBoundingClientRect();
        var hit = d.elementFromPoint(pr.left + pr.width / 2, pr.top + 30);
        document.getElementById('out').textContent = JSON.stringify({
          display: cs.display, zIndex: cs.zIndex, position: cs.position, opacity: cs.opacity,
          animation: cs.animationName, transform: cs.transform, filter: cs.filter, backdrop: cs.backdropFilter,
          parent: m.parentElement.tagName + '.' + m.parentElement.className,
          parentZ: w.getComputedStyle(m.parentElement).zIndex,
          rect: { t: Math.round(r.top), l: Math.round(r.left), w: Math.round(r.width), h: Math.round(r.height) },
          panelRect: { t: Math.round(pr.top), l: Math.round(pr.left), w: Math.round(pr.width), h: Math.round(pr.height) },
          hitAtPanelTop: hit ? (hit.tagName + '.' + hit.className) : 'none',
          hitInsideModal: !!(hit && m.contains(hit))
        }, null, 1);
      }, 600);
    }, 300);
  }, 700);
});
</script></body></html>

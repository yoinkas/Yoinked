<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>tip popup</title>
<style>body{margin:0;background:#0b0d12}iframe{width:1200px;height:720px;border:0;display:block}</style></head>
<body>
<iframe id="f" src="/index.html"></iframe>
<script>
document.getElementById('f').addEventListener('load', function () {
  var d = this.contentDocument, w = this.contentWindow;
  setTimeout(function () {
    var W = w.WriteUp, n = W.getCurrent();
    n.blocks = [
      { id: 'p-h', type: 'h2', html: 'Reconnaissance' },
      { id: 'p-t', type: 'text', html: 'The web server on port 80 is nginx. Fuzzing the paths turns up a backup file.' },
      { id: 'p-tip', type: 'tip', html: 'Always grab the .bak files', body: 'Nginx serves *.bak as plain text when a stray copy is left in /var/www/html.\n\nCheck /index.php.bak and /config.php~ before you start brute forcing anything.' },
      { id: 'p-t2', type: 'text', html: 'Downloading index.php.bak gives me the whole source.' }
    ];
    W.persist(); W.render();
    setTimeout(function () { w.WriteUpTips.open('p-tip'); }, 250);
  }, 600);
});
</script>
</body></html>

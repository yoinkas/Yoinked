(function(){
  var notes=JSON.parse(localStorage.getItem('writeup_notes_v4')||'[]');
  var note=notes.filter(function(n){return n.title==='Block showcase';})[0];
  if(!note)return;
  var blocks=note.blocks||[];
  var insertAt=blocks.filter(function(b){return b.type==='h2';}).length;
  blocks.splice(insertAt,0,
    {id:'tip-demo-1',type:'tip',html:'Convert the port scan to a table',body:'Paste the nmap output into a table block so the open ports are easy to scan. Keep the raw output in a code block underneath for reference.'},

})();

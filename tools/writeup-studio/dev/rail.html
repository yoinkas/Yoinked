<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>code block rail</title>
<style>body{margin:0;background:#0b0d12}iframe{width:1180px;height:700px;border:0;display:block}</style></head>
<body>
<iframe id="f" src="/index.html"></iframe>
<script>
document.getElementById('f').addEventListener('load', function () {
  var d = this.contentDocument, w = this.contentWindow;
  setTimeout(function () {
    var W = w.WriteUp, n = W.getCurrent();
    n.blocks = [
      { id: 'r-h', type: 'h2', html: 'Exploitation' },
      { id: 'r-c', type: 'code', lang: 'bash', theme: 'code', src: 'nmap -sC -sV -p- 10.65.177.141\n\nPORT     STATE SERVICE VERSION\n22/tcp   open  ssh     OpenSSH 8.9p1' },
      { id: 'r-t', type: 'text', html: 'The SSH service is running on the default port.' }
    ];
    W.persist(); W.render();
    setTimeout(function () {
      /* force the hover rail open so the screenshot shows it */
      var st = d.createElement('style');
      st.textContent = '.block-rail{opacity:1 !important}';
      d.head.appendChild(st);
    }, 200);
  }, 600);
});
</script>
</body></html>
